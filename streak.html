<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woy Ayu streak!</title>
<style>
  :root{
    --bg:#15101f; --bg2:#2a1630; --text:#fff4e8; --muted:#a99bb8;
    --red:#ff3b30; --orange:#ff7a1a; --yellow:#ffd23f; --cream:#fff3c4;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    color:var(--text);background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;overflow:hidden;position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;opacity:0;
    background:radial-gradient(circle at 50% 45%,rgba(255,122,26,.45),transparent 60%);
    transition:opacity 1.2s ease;
  }
  body.lit::before{opacity:1}
  main{position:relative;z-index:1;width:100%;max-width:360px}

  h1{font-size:1.6rem;line-height:1.25;margin-bottom:6px}
  .sub{color:var(--muted);font-size:1rem;margin-bottom:28px;min-height:2.6em}

  .flame-wrap{position:relative;width:190px;height:240px;margin:0 auto 18px}
  svg.flame{width:100%;height:100%;overflow:visible}
  .layer{transform-box:fill-box;transform-origin:50% 100%}

  .flame .outer{fill:#3a3048}
  .flame .mid{fill:#2f2640}
  .flame .inner{fill:#251d33}
  .flame{transition:filter .6s}

  body.lit .outer{fill:var(--red);animation:sway 1.5s ease-in-out infinite}
  body.lit .mid{fill:var(--orange);animation:sway 1.1s ease-in-out infinite reverse}
  body.lit .inner{fill:var(--yellow);animation:sway .8s ease-in-out infinite}
  body.lit .flame{filter:drop-shadow(0 0 22px rgba(255,122,26,.85))}
  body.igniting .flame{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}

  @keyframes sway{
    0%,100%{transform:scale(1,1) skewX(0)}
    25%{transform:scale(.95,1.06) skewX(-3deg)}
    50%{transform:scale(1.04,.96) skewX(2deg)}
    75%{transform:scale(.97,1.05) skewX(-2deg)}
  }
  @keyframes pop{
    0%{transform:scale(.3);opacity:.2}
    60%{transform:scale(1.18)}
    100%{transform:scale(1);opacity:1}
  }

  .spark{
    position:absolute;bottom:40px;left:50%;border-radius:50%;
    background:var(--yellow);box-shadow:0 0 8px var(--orange);
    pointer-events:none;opacity:0;
    animation:rise var(--d) ease-out var(--delay) infinite;
  }
  @keyframes rise{
    0%{opacity:0;transform:translate(0,0) scale(1)}
    15%{opacity:1}
    100%{opacity:0;transform:translate(var(--x),-210px) scale(.2)}
  }

  .streak{
    font-size:3.4rem;font-weight:800;line-height:1;color:var(--muted);
    transition:color .6s;
  }
  body.lit .streak{color:var(--cream);text-shadow:0 0 18px rgba(255,122,26,.7)}
  .streak-label{color:var(--muted);margin:4px 0 28px;font-size:.95rem}

  button{
    font:inherit;font-weight:700;font-size:1.15rem;
    border:0;border-radius:999px;padding:16px 44px;width:100%;
    color:#2b1200;background:linear-gradient(180deg,var(--yellow),var(--orange));
    box-shadow:0 8px 26px rgba(255,122,26,.35);cursor:pointer;
    transition:transform .15s, opacity .4s;
  }
  button:active{transform:scale(.96)}
  button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
  button:disabled{opacity:.55;cursor:default;box-shadow:none;transform:none}

  @media (prefers-reduced-motion:reduce){
    body.lit .layer,.spark,body.igniting .flame{animation:none}
  }
</style>
</head>
<body>
<main>
  <h1 id="judul">Woy Ayu streak!</h1>
  <p class="sub" id="pesan">Pencet tombol yang di bawah ya bab1</p>

  <div class="flame-wrap" id="wrap">
    <svg class="flame" viewBox="0 0 100 130" aria-hidden="true">
      <path class="layer outer" d="M50 4C56 30 86 46 86 82C86 110 69 126 50 126C31 126 14 110 14 82C14 64 25 53 31 40C34 53 40 57 44 57C41 38 44 20 50 4Z"/>
      <path class="layer mid" d="M50 38C54 54 72 64 72 88C72 108 62 120 50 120C38 120 28 108 28 88C28 77 34 70 38 62C40 69 44 72 47 72C45 60 46 49 50 38Z"/>
      <path class="layer inner" d="M50 70C53 80 62 86 62 99C62 111 56 118 50 118C44 118 38 111 38 99C38 93 41 89 43 85C45 89 47 90 48 90C47 83 48 76 50 70Z"/>
    </svg>
  </div>

  <div class="streak" id="angka">19</div>
  <div class="streak-label">hari streak</div>

  <button id="tombol">Aktifkan streak</button>
</main>

<script>
  const body = document.body;
  const tombol = document.getElementById('tombol');
  const angka = document.getElementById('angka');
  const pesan = document.getElementById('pesan');
  const wrap = document.getElementById('wrap');

  const hariIni = () => new Date().toISOString().slice(0, 10);
  const kemarin = () => new Date(Date.now() - 864e5).toISOString().slice(0, 10);

  function baca() {
    try { return JSON.parse(localStorage.getItem('streak')) || { count: 19, last: '' }; }
    catch (e) { return { count: 19, last: '' }; }
  }
  function simpan(d) {
    try { localStorage.setItem('streak', JSON.stringify(d)); } catch (e) {}
  }

  function tambahPercikan() {
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      const ukuran = 4 + Math.random() * 5;
      s.style.width = s.style.height = ukuran + 'px';
      s.style.marginLeft = (Math.random() * 90 - 45) + 'px';
      s.style.setProperty('--x', (Math.random() * 70 - 35) + 'px');
      s.style.setProperty('--d', (1.6 + Math.random() * 1.6) + 's');
      s.style.setProperty('--delay', (Math.random() * 2) + 's');
      wrap.appendChild(s);
    }
  }

  function nyalakan(animasi) {
    body.classList.add('lit');
    if (animasi) {
      body.classList.add('igniting');
      setTimeout(() => body.classList.remove('igniting'), 1000);
    }
    tambahPercikan();
    tombol.disabled = true;
    tombol.textContent = 'Api sudah menyala 🔥';
    pesan.textContent = 'Mantap! Sekarang buka TikTok dan kirim snap-nya.';
  }

  const data = baca();
  angka.textContent = data.count;

  if (data.last === hariIni()) nyalakan(false);
  else if (data.last && data.last !== kemarin()) { data.count = 0; angka.textContent = 0; simpan(data); }

  tombol.addEventListener('click', () => {
    const d = baca();
    // pertama kali (last kosong) lanjut dari 19, lalu tiap hari +1
    d.count = (d.last === '' || d.last === kemarin() ? d.count : 0) + 1;
    d.last = hariIni();
    simpan(d);
    angka.textContent = d.count;
    nyalakan(true);
  });
</script>
</body>
</html>
